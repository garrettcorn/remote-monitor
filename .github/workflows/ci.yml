name: CI - Test & Cross-Build Validation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test-and-validate:
    name: Test & Validate Changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: Validate Common Changelog
        run: |
          go run ./cmd/changelog validate

      - name: Run Unit Tests
        run: |
          go test -v ./...

  cross-compile:
    name: Build (${{ matrix.target.os }}/${{ matrix.target.arch }})
    needs: test-and-validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { os: windows, arch: amd64, ext: .exe }
          - { os: windows, arch: arm64, ext: .exe }
          - { os: linux,   arch: amd64, ext: "" }
          - { os: linux,   arch: arm64, ext: "" }
          - { os: darwin,  arch: arm64, ext: "" }
          - { os: darwin,  arch: amd64, ext: "" }
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: Compile Binary
        env:
          GOOS: ${{ matrix.target.os }}
          GOARCH: ${{ matrix.target.arch }}
        run: |
          mkdir -p build
          go build -ldflags="-s -w" -o "build/pc_monitor_${{ matrix.target.os }}_${{ matrix.target.arch }}${{ matrix.target.ext }}" ./cmd/server
