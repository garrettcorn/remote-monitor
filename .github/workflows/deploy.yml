name: Deploy Client & Build Servers

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Job 1: Deploy static web dashboard to GitHub Pages
  deploy-pages:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './web'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Job 2: Cross-compile server binaries for Windows, Linux, macOS, Android
  build-binaries:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          check-latest: true

      - name: Build All Cross-Platform Binaries
        run: |
          mkdir -p dist
          # Windows
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o dist/pc_monitor_windows_amd64.exe ./cmd/server
          GOOS=windows GOARCH=arm64 go build -ldflags="-s -w" -o dist/pc_monitor_windows_arm64.exe ./cmd/server
          # Linux (also runs on Android via Termux)
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/pc_monitor_linux_amd64 ./cmd/server
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/pc_monitor_linux_arm64 ./cmd/server
          # macOS (Apple Silicon & Intel)
          GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o dist/pc_monitor_darwin_arm64 ./cmd/server
          GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o dist/pc_monitor_darwin_amd64 ./cmd/server

      - name: Upload Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pc-monitor-binaries
          path: dist/*
